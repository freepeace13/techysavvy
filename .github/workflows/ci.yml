name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --working-dir=host --prefer-dist --no-progress

      - name: Lint (Pint)
        run: cd host && ./vendor/bin/pint --test

      - name: Copy environment file
        run: cp host/.env.example host/.env

      - name: Generate application key
        run: cd host && php artisan key:generate

      - name: Run tests
        run: cd host && php artisan test
